# OPENROUTER_API_KEY resolves only in bearer requests from Node to openrouter.ai.
id: openrouter
display_name: OpenRouter
description: OpenRouter inference API for the Ory Agent Security hello-world example
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenRouter API key
    env_vars: [OPENROUTER_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: openrouter.ai
    port: 443
    path: /api/**
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/node
