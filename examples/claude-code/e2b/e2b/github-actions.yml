name: Deploy Claude Code to E2B

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: claude-code-e2b-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/claude-code/e2b
    env:
      ORY_PROJECT_URL: ${{ vars.ORY_PROJECT_URL }}
      ORY_AGENT_SECURITY_URL: https://agents.console.ory.com
      ORY_AGENT_DEPLOYMENT_ID: ${{ vars.ORY_AGENT_DEPLOYMENT_ID }}
      E2B_TEMPLATE_TAG: ory-claude-code-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version-file: examples/claude-code/e2b/.python-version
          cache: pip
          cache-dependency-path: examples/claude-code/e2b/e2b/requirements-controller.txt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install E2B controller dependencies
        run: |
          python -m pip install --requirement e2b/requirements-controller.txt
          npm install --global @e2b/cli@2.21.0

      - name: Build immutable E2B template
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          set -euo pipefail
          python e2b/deploy.py build --tag "${E2B_TEMPLATE_TAG}" \
            --output "${RUNNER_TEMP}/e2b-template.json"

      - name: Restore Agent Security deployment credential
        env:
          ORY_AGENT_CREDENTIALS: ${{ secrets.ORY_AGENT_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "${ORY_AGENT_DEPLOYMENT_ID}"
          test -n "${ORY_AGENT_CREDENTIALS}"
          umask 077
          printf '%s' "${ORY_AGENT_CREDENTIALS}" > "${RUNNER_TEMP}/ory-agent.env"

      - name: Reuse deployment and run activation probe
        id: ory-agent
        uses: ory/ory-agent@v1.9.1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        with:
          api-key: ${{ secrets.ORY_AGENT_DEPLOY_API_KEY }}
          project-url: ${{ vars.ORY_PROJECT_URL }}
          agent-security-url: https://agents.console.ory.com
          manifest: examples/claude-code/e2b/.ory/agent.yaml
          deployment-id: ${{ vars.ORY_AGENT_DEPLOYMENT_ID }}
          credential-file: ${{ runner.temp }}/ory-agent.env
          run: >-
            python examples/claude-code/e2b/e2b/deploy.py probe
            --template-file "${RUNNER_TEMP}/e2b-template.json"

      - name: Remove controller artifacts
        if: always()
        run: rm -f "${RUNNER_TEMP}/e2b-template.json" "${RUNNER_TEMP}/ory-agent.env"
