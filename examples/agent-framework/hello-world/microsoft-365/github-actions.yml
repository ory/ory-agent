name: Deploy Agent Framework Agent to Microsoft 365

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment
        required: true
        type: environment

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-framework-m365-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/agent-framework/hello-world
    env:
      ORY_PROJECT_URL: ${{ vars.ORY_PROJECT_URL }}
      ORY_AGENT_SECURITY_URL: https://agents.console.ory.com
      ORY_AGENT_DEPLOYMENT_ID: ${{ vars.ORY_AGENT_DEPLOYMENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      # Optional: empty values use the resource group's region and Global Standard.
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      FOUNDRY_MODEL_SKU: ${{ vars.FOUNDRY_MODEL_SKU }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version-file: examples/agent-framework/hello-world/.python-version
          cache: pip
          cache-dependency-path: examples/agent-framework/hello-world/microsoft-365/requirements-controller.txt

      - name: Install deployment controller dependencies
        run: python -m pip install --requirement microsoft-365/requirements-controller.txt

      # Keyless: GitHub OIDC federates to an Entra workload identity. No Azure secret is stored.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build immutable Agent image
        run: |
          set -euo pipefail
          python microsoft-365/deploy.py build \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --registry "${AZURE_CONTAINER_REGISTRY}" \
            --tag "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/image.json"

      - name: Restore Agent Security deployment credential
        env:
          ORY_AGENT_CREDENTIALS: ${{ secrets.ORY_AGENT_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "${ORY_AGENT_DEPLOYMENT_ID}"
          test -n "${ORY_AGENT_CREDENTIALS}"
          umask 077
          printf '%s' "${ORY_AGENT_CREDENTIALS}" > "${RUNNER_TEMP}/ory-agent.env"

      - name: Reuse deployment and run activation probe
        id: ory-agent
        uses: ory/ory-agent@v1.10.1
        with:
          api-key: ${{ secrets.ORY_AGENT_DEPLOY_API_KEY }}
          project-url: ${{ vars.ORY_PROJECT_URL }}
          agent-security-url: https://agents.console.ory.com
          manifest: examples/agent-framework/hello-world/.ory/agent.yaml
          deployment-id: ${{ vars.ORY_AGENT_DEPLOYMENT_ID }}
          credential-file: ${{ runner.temp }}/ory-agent.env
          run: >-
            python examples/agent-framework/hello-world/microsoft-365/deploy.py deploy
            --resource-group "${AZURE_RESOURCE_GROUP}"
            --registry "${AZURE_CONTAINER_REGISTRY}"
            --name-prefix "${AZURE_NAME_PREFIX}"
            --image-file "${RUNNER_TEMP}/image.json"

      - name: Build Microsoft 365 app package
        run: |
          set -euo pipefail
          outputs="$(az deployment group show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name ory-agent-framework-hello-world \
            --query properties.outputs --output json)"
          python microsoft-365/deploy.py package \
            --bot-app-id "$(jq -r .botAppId.value <<<"${outputs}")" \
            --endpoint "$(jq -r .endpoint.value <<<"${outputs}")" \
            --output "${RUNNER_TEMP}/appPackage.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microsoft-365-app-package
          path: ${{ runner.temp }}/appPackage.zip
          if-no-files-found: error

      - name: Remove controller artifacts
        if: always()
        run: rm -f "${RUNNER_TEMP}/image.json" "${RUNNER_TEMP}/ory-agent.env" "${RUNNER_TEMP}/appPackage.zip"
