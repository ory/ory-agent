name: Deploy OpenAI Agent to exe.dev

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: openai-exe-dev-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/openai-agents/hello-world/exe-dev
    env:
      ORY_PROJECT_URL: ${{ vars.ORY_PROJECT_URL }}
      ORY_AGENT_SECURITY_URL: https://agents.console.ory.com
      ORY_AGENT_DEPLOYMENT_ID: ${{ vars.ORY_AGENT_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version-file: examples/openai-agents/hello-world/.python-version

      - name: Package the credential-free Agent bundle
        run: |
          set -euo pipefail
          python deploy.py bundle --output "${RUNNER_TEMP}/exe-dev-bundle.tar.gz"

      - name: Restore controller credentials
        env:
          ORY_AGENT_CREDENTIALS: ${{ secrets.ORY_AGENT_CREDENTIALS }}
          EXE_DEV_SSH_PRIVATE_KEY: ${{ secrets.EXE_DEV_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${ORY_AGENT_DEPLOYMENT_ID}"
          test -n "${ORY_AGENT_CREDENTIALS}"
          test -n "${EXE_DEV_SSH_PRIVATE_KEY}"
          umask 077
          printf '%s' "${ORY_AGENT_CREDENTIALS}" > "${RUNNER_TEMP}/ory-agent.env"
          printf '%s\n' "${EXE_DEV_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/exe-dev-ssh-key"

      - name: Reuse deployment and run activation probe
        id: ory-agent
        uses: ory/ory-agent@v1.10.0
        env:
          EXE_DEV_SSH_IDENTITY_FILE: ${{ runner.temp }}/exe-dev-ssh-key
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          api-key: ${{ secrets.ORY_AGENT_DEPLOY_API_KEY }}
          project-url: ${{ vars.ORY_PROJECT_URL }}
          agent-security-url: https://agents.console.ory.com
          manifest: examples/openai-agents/hello-world/exe-dev/.ory/agent.yaml
          deployment-id: ${{ vars.ORY_AGENT_DEPLOYMENT_ID }}
          credential-file: ${{ runner.temp }}/ory-agent.env
          run: >-
            python examples/openai-agents/hello-world/exe-dev/deploy.py probe
            --bundle-file "${RUNNER_TEMP}/exe-dev-bundle.json"

      - name: Remove controller artifacts
        if: always()
        run: >-
          rm -f "${RUNNER_TEMP}/exe-dev-bundle.tar.gz" "${RUNNER_TEMP}/exe-dev-bundle.json"
          "${RUNNER_TEMP}/ory-agent.env" "${RUNNER_TEMP}/exe-dev-ssh-key"
